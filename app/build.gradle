plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.bibleproia.app'
    compileSdk 36

    defaultConfig {
        applicationId 'fr.bibleproia.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
}
