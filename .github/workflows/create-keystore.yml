name: Create BibleProIA signing key

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Créer le keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore bibleproia-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=BibleProIA, OU=BibleProIA, O=BibleProIA, L=France, ST=Normandie, C=FR"

      - name: Convertir en Base64
        run: |
          base64 -w 0 bibleproia-release.jks > bibleproia-release.base64

      - name: Publier la clé
        uses: actions/upload-artifact@v4
        with:
          name: BibleProIA-signing-key
          path: |
            bibleproia-release.jks
            bibleproia-release.base64
